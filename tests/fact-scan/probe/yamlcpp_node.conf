# How tools/fact-gauge/probe_pack.py makes and observes a YAML::Node (yaml-cpp). A Node is a HANDLE to memory that other handles share.
type          = YAML::Node
include       = <yaml-cpp/yaml.h>
make          = YAML::Load("{a: hello, b: world}")
# the node gets a tag long enough to live in a heap buffer; the "view" is a raw pointer into that buffer, so a call that reassigns the tag frees it
cxx_setup     = {obj}.SetTag("a tag that is far too long to fit inside the small-string buffer of std::string");
cxx_view_decl = const char*
cxx_view      = {obj}.Tag().c_str()
touch         =
cxx_touch     = {view}[0]
# no CeeLing-writable view maker (Node's views come from operator[], which the scanner leaves to hand-written facts): the compiler half is skipped
view          =
flags         = -DYAML_CPP_STATIC_DEFINE
sources       = @YAML@/src/*.cpp
# View 2: an iterator into the map's node list
cxx_view2_decl = YAML::Node::iterator
cxx_view2      = {obj}.begin()
cxx_touch2     = {view2}->first.Scalar().size()
# The observable state: the document as text (includes the tag)
state          = YAML::Dump({obj})
