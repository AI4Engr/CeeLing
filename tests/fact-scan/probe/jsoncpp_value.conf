# How tools/fact-gauge/probe_pack.py makes and observes a Json::Value (jsoncpp), set JSONCPP_DIR-relative paths via the test script.
type       = Json::Value
include    = <json/json.h>
# the CeeLing program only needs a value of the type; the C++ twin needs an OBJECT with members, built by cxx_setup
clg_make   = new Json::Value(7)
make       = Json::Value(Json::objectValue)
cxx_setup  = {obj}["a"] = 1; {obj}["b"] = 2;
# CeeLing side: removeMember has no fact (it returns a Value by value), so the compiler treats its result as a borrow of the receiver
view       = {obj}.removeMember("zz")
# C++ side: a real reference into the object's internal map (what operator[] hands out); a stale one is a use-after-free
cxx_view_decl = auto&
cxx_view   = {obj}["a"]
touch      = {view}.isNull()
cxx_touch  = {view}.asInt()
flags      = -DJSON_USE_EXCEPTION=0
sources    = @JSON@/src/lib_json/json_value.cpp, @JSON@/src/lib_json/json_reader.cpp, @JSON@/src/lib_json/json_writer.cpp
