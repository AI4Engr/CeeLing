# How tools/fact-gauge/probe_pack.py makes and observes an Eigen::VectorXd.
type    = Eigen::VectorXd
include = <Eigen/Dense>
make    = Eigen::VectorXd::Ones(8)
# --- the CeeLing half: head(2) has no fact in the scanned pack (an expression template), so the compiler treats it as a borrow of the receiver
view    = {obj}.head(2)
touch   = {view}.sum()
# --- the C++ half. View 1: the LAZY expression itself (`auto`), reads the elements it refers to
cxx_view_decl = auto
cxx_view      = {obj}.head(2)
cxx_touch     = {view}.sum()
# View 2: a raw pointer into the storage, the other way a view of a vector is held
cxx_view2_decl = const double*
cxx_view2      = {obj}.data()
cxx_touch2     = {view2}[0]
# The object's observable state: a fresh method must leave it unchanged (this is what sees a value rewritten IN PLACE, which AddressSanitizer cannot)
state   = {obj}.sum()
