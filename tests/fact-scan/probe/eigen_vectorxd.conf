# How tools/fact-gauge/probe_pack.py makes and observes an Eigen::VectorXd.
type    = Eigen::VectorXd
include = <Eigen/Dense>
make    = Eigen::VectorXd::Ones(8)
# head(2) has no fact in the scanned pack (an expression template): the compiler treats it as a borrow of the receiver
view    = {obj}.head(2)
# reads the elements the view refers to: if the owner's storage was freed or moved, AddressSanitizer reports it
touch   = {view}.sum()
