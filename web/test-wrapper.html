<!DOCTYPE html>
<html>
<head>
    <title>MADOLA Browser Wrapper Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>MADOLA Browser Wrapper Test</h1>
    <div id="status">Testing...</div>
    <div id="results"></div>

    <script src="js/madola-browser.js"></script>
    <script>
        async function testMadolaWrapper() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            function addStatus(message, type = 'info') {
                const div = document.createElement('div');
                div.className = `status ${type}`;
                div.textContent = message;
                statusDiv.appendChild(div);
            }

            try {
                addStatus('Creating MADOLA browser wrapper...', 'info');
                const wrapper = new MadolaBrowserWrapper();

                addStatus('Loading WASM module...', 'info');
                await wrapper.loadModule();

                addStatus('WASM module loaded successfully!', 'success');

                addStatus('Testing evaluation...', 'info');
                const evalResult = await wrapper.evaluate('x := 42; print(x);');

                if (evalResult) {
                    addStatus('Evaluation test passed!', 'success');
                    resultsDiv.innerHTML += `<h3>Evaluation Result:</h3><pre>${evalResult}</pre>`;
                } else {
                    addStatus('Evaluation returned null', 'error');
                }

                addStatus('Testing formatting...', 'info');
                const formatResult = await wrapper.format('fn test() { x := 1; return x; }', 1);

                if (formatResult) {
                    addStatus('Formatting test passed!', 'success');
                    resultsDiv.innerHTML += `<h3>Format Result:</h3><pre>${formatResult}</pre>`;
                } else {
                    addStatus('Formatting returned null', 'error');
                }

                addStatus('All tests completed!', 'success');

            } catch (error) {
                addStatus(`Error: ${error.message}`, 'error');
                resultsDiv.innerHTML += `<h3>Error Details:</h3><pre>${error.stack}</pre>`;
            }
        }

        testMadolaWrapper();
    </script>
</body>
</html>
